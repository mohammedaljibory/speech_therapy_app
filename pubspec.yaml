name: speech_therapy_app
description: نظام تحسين النطق عند أطفال التوحد - Speech Therapy System for Autistic Children

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Localization
  flutter_localizations:
    sdk: flutter

  # State Management
  provider: ^6.1.1
  
  # Firebase - Latest versions for Flutter 3.x
  firebase_core: ^3.8.1
  firebase_auth: ^5.3.4
  cloud_firestore: ^5.6.0
  firebase_storage: ^12.4.0
  
  # Audio Recording & Playing
 # record: ^5.1.2
  audioplayers: ^6.1.0


  timezone: ^0.9.2
  connectivity_plus: ^5.0.2

  # UI & Animations
  lottie: ^3.1.3
  fl_chart: ^0.69.2
  cached_network_image: ^3.4.1
  flutter_animate: ^4.5.0
  google_fonts: ^6.2.1
  
  # Image Picker
  image_picker: ^1.1.2
  
  # PDF & Reports
  pdf: ^3.11.1
  printing: ^5.13.4
  
  # Utils
  intl: ^0.20.2
  path_provider: ^2.1.5
  uuid: ^4.5.1
  shared_preferences: ^2.3.3
  
  # Icons
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.14

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
